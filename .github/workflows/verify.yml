name: library-verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: チェックアウト
        uses: actions/checkout@v5

      - name: Nix をインストール
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: テストケースのキャッシュ
        uses: actions/cache@v4
        with:
          path: .competitive-verifier/cache
          key: library-verify-${{ runner.os }}-${{ hashFiles('verify/**', 'library/cpp/**', 'scripts/verify-cxx', 'scripts/verify-library') }}
          restore-keys: |
            library-verify-${{ runner.os }}-

      - name: Library Checker
        run: nix develop --command bash scripts/verify-library
